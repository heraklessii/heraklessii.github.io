<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>heraklessi — games</title>
<style>
  :root { --bg:#1A0F24; --card:#2C1B3E; --text:#F8EBD8; --muted:#B7A1CC; --gold:#FFD45E; --line:#3E2856; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px; }
  h1 { color:var(--gold); margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-top:24px; }
  .card h2 { margin:0 0 4px; color:var(--gold); font-size:20px; }
  a { color:var(--gold); }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>heraklessi</h1>
  <p class="muted">Small, cozy games.</p>
  <div class="card">
    <h2>Mirela's Cauldron</h2>
    <p>A cozy idle alchemy game in pixel art. Tap the cauldron, brew potions and grow your magic shop.</p>
    <p><a href="mirelas-cauldron/privacy/">Privacy Policy / Gizlilik Politikası</a></p>
  </div>
</main>
</body>
</html>
